name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin zip
        run: |
          mkdir -p build/weave-style-guide
          rsync -a --exclude .git --exclude .github --exclude build --exclude '*.zip' --exclude .gitignore ./ build/weave-style-guide/
          cd build && zip -rq ../weave-style-guide.zip weave-style-guide
      - name: Create release with the zip attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" weave-style-guide.zip --title "$GITHUB_REF_NAME" --generate-notes
